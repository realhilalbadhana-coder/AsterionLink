name: Build Asterion Link

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find . -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "Using project: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle --no-daemon :app:assembleDebug

      - name: Show APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asterion-Link-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
